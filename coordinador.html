<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convocate · Coordinador</title>
<meta name="theme-color" content="#123B4A" />
<link rel="manifest" href="./manifest-coordinador.json" />
<link rel="icon" href="./icon.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#F4F1EC; --surface:#FFFFFF; --ink:#17262B; --ink-soft:#5B6B70;
    --primary:#123B4A; --primary-soft:#E7EEEF; --accent:#E8A33D; --accent-soft:#FBEBD1;
    --ok:#3B7A57; --ok-soft:#E3F0E8; --warn:#B4472A; --warn-soft:#F7E3DE; --line:#E4DFD5; --radius:16px;
    --suisas:#6B3FA0; --suisas-soft:#EFE6F7;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,sans-serif;}
  header{ background:var(--surface); color:var(--ink); padding:20px; border-radius:0 0 20px 20px; border-bottom:1px solid var(--line); text-align:center; }
  header img.logo{ max-width:200px; width:100%; height:auto; display:block; margin:0 auto 6px; }
  header p{ margin:4px 0 0; font-size:0.8rem; color:var(--ink-soft); }
  main{ max-width:640px; margin:0 auto; padding:16px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .card h2{ font-family:"Fraunces",serif; font-size:1rem; margin:0 0 12px; }
  .proceso-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .proceso-row:first-child{ border-top:none; }
  .proceso-info .titulo{ font-weight:600; font-size:0.9rem; }
  .proceso-info .detalle{ font-size:0.78rem; color:var(--ink-soft); }
  .estado-pill{ font-size:0.7rem; font-weight:600; padding:3px 9px; border-radius:999px; }
  .estado-ACTIVO, .estado-ACTIVA{ background:var(--ok-soft); color:var(--ok); }
  .estado-PAUSADO, .estado-PAUSADA{ background:var(--warn-soft); color:var(--warn); }
  .estado-FINALIZADO, .estado-FINALIZADA{ background:var(--line); color:var(--ink-soft); }
  .tag-suisas{ font-size:0.65rem; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--suisas-soft); color:var(--suisas); margin-left:6px; letter-spacing:0.02em; }
  button{ font-family:inherit; border:none; border-radius:10px; padding:8px 12px; font-size:0.8rem; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-warn{ background:var(--warn); color:#fff; }
  .btn-ok{ background:var(--ok); color:#fff; }
  select, input{ width:100%; padding:9px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
  label{ display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
  .status-msg{ font-size:0.8rem; color:var(--ink-soft); text-align:center; padding:14px; }
  .msg-ok{ color:var(--ok); font-size:0.82rem; margin-top:8px; }
  .msg-error{ color:var(--warn); font-size:0.82rem; margin-top:8px; }
  #login-gate{ position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; padding:16px; }
  #login-gate .card{ width:min(360px,92vw); }
  #login-gate input{ margin-bottom:10px; }
</style>
</head>
<body>

<header>
  <img class="logo" src="./logo-completo.png" alt="ConvocaTE - Asociación Española" />
  <p id="header-mes-coord">Panel del coordinador · Octubre 2026</p>
  <button id="btn-notif-coord" style="display:none; margin-top:8px; padding:6px 12px; border:2px solid var(--ink); border-radius:6px; background:transparent; color:var(--ink); font-family:inherit; font-size:0.78rem; font-weight:700; cursor:pointer;">
    🔔 Activar avisos de coordinador
  </button>
  <div id="notif-coord-status" style="margin-top:6px; text-align:center; font-size:0.8rem; color:var(--ink-soft);"></div>
</header>

<div id="login-gate">
  <div class="card">
    <h2 id="login-titulo">Ingresá la contraseña de coordinador</h2>
    <p id="login-texto" style="font-size:0.82rem; color:var(--ink-soft); margin-top:-6px;"></p>
    <input type="password" id="login-input" placeholder="Contraseña" autocomplete="current-password" />
    <input type="password" id="login-input-confirmar" placeholder="Repetí la contraseña" autocomplete="new-password" style="display:none;" />
    <button class="btn-primary" id="login-btn" style="width:100%;">Entrar</button>
    <div id="login-error" class="msg-error"></div>
  </div>
</div>

<main style="display:none;">
  <div class="card">
    <h2>Gestión de planilla</h2>
    <label>Mes</label>
    <div id="coord-mes-selector" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;"></div>
    <label>Sector</label>
    <select id="coord-sector">
      <option value="">— elegí un sector —</option>
      <option>BQ</option><option>BSE</option><option>CCA</option>
      <option>CENDYTMA</option><option>DENSITO</option><option>EMERG</option>
      <option>FOTOG</option><option>GREMCA</option><option>GUARDIA</option>
      <option>POLI</option><option>RESO</option><option>RETEN</option>
      <option>SOLY</option><option>TC</option><option>TRAUMA</option><option>UCAL</option>
    </select>
    <button id="btn-resumen-vacantes" class="btn-primary" style="margin-top:8px;">
      📋 Ver vacantes (todos los sectores)
    </button>
    <button id="btn-exportar-excel" class="btn-primary" style="margin-top:8px;">
      📥 Descargar planilla pública en Excel (16 hojas)
    </button>
    <div style="display:flex; justify-content:flex-end; margin:8px 0;">
      <div style="display:flex; align-items:center; background:#f4f4f4; border-radius:20px; padding:2px;">
        <button id="btn-zoom-out-coord" style="width:28px; height:28px; border:none; border-radius:50%; background:transparent; color:var(--ink-soft); font-size:0.95rem; cursor:pointer; line-height:1;">－</button>
        <button id="btn-zoom-reset-coord" style="height:28px; padding:0 8px; border:none; background:transparent; color:var(--ink-soft); font-size:0.7rem; cursor:pointer;">100%</button>
        <button id="btn-zoom-in-coord" style="width:28px; height:28px; border:none; border-radius:50%; background:transparent; color:var(--ink-soft); font-size:0.95rem; cursor:pointer; line-height:1;">＋</button>
      </div>
    </div>
    <div id="coord-grilla-wrap" style="overflow-x:auto;"></div>
  </div>

  <!-- Modal de acción sobre celda -->
  <div id="coord-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:20px;width:min(360px,92vw);display:flex;flex-direction:column;gap:12px;">
      <div style="font-weight:700;font-size:0.95rem;" id="coord-modal-titulo"></div>
      <button id="coord-btn-activar" class="btn-ok" style="display:none;">✓ Activar para convocatoria</button>
      <button id="coord-btn-vacante" class="btn-ok" style="display:none;">◯ Dejar como vacante (LIBRE)</button>
      <button id="coord-btn-vacante-suisas" class="btn-ok" style="display:none;">◯ Dejar vacante — exclusiva SUISAS (ya mismo)</button>
      <button id="coord-btn-quitar-suisas" class="btn-warn" style="display:none;">↩ Volver a modo normal (Española + SUISAS)</button>
      <div id="coord-asignar-wrap" style="display:none;">
        <label>Asignar a</label>
        <select id="coord-sel-persona"></select>
        <button class="btn-primary" id="coord-btn-asignar">Asignar</button>
      </div>
      <button id="coord-btn-desactivar" class="btn-warn" style="display:none;">✗ Desactivar / Quitar persona</button>
      <button id="coord-btn-cerrar" style="background:var(--line);color:var(--ink);">Cerrar</button>
    </div>
  </div>

  <div class="card">
    <h2>Solicitudes de cambio</h2>
    <div id="solicitudes-wrap"></div>

    <h2>Procesos activos</h2>
    <div id="procesos-wrap"><div class="status-msg">Cargando...</div></div>

    <h2>Procesos activos SUISAS</h2>
    <div id="procesos-suisas-wrap"><div class="status-msg">Cargando...</div></div>
  </div>

  <div class="card">
    <h2>Habilitar a alguien puntual</h2>
    <label>Grupo</label>
    <select id="hab-grupo">
      <option value="RESTO">RESTO</option>
      <option value="TC">TC</option>
      <option value="RESO">RESO</option>
    </select>
    <label>Tipo</label>
    <select id="hab-tipo">
      <option value="GENERAL">General</option>
      <option value="NOCHEROS">Nocheros (guardia)</option>
    </select>
    <label>Persona</label>
    <select id="hab-persona"><option value="">Cargando...</option></select>
    <button class="btn-primary" id="btn-habilitar" style="width:100%;">Habilitar ahora</button>
    <div id="hab-msg"></div>
  </div>

  <div class="card">
    <h2>No participará este mes</h2>
    <label>Persona</label>
    <select id="exc-persona"><option value="">Cargando...</option></select>
    <button class="btn-warn" id="btn-excluir-todas" style="width:100%;">Excluir de TODAS las listas que integra este mes (recomendado)</button>
    <div id="exc-msg"></div>
    <details style="margin-top:10px;">
      <summary style="cursor:pointer;color:var(--muted);font-size:0.85rem;">Excluir de una sola lista puntual en vez de todas</summary>
      <div style="margin-top:8px;">
        <label>Lista</label>
        <select id="exc-grupo">
          <option value="RESTO">RESTO</option>
          <option value="TC">TC</option>
          <option value="RESO_BSE">RESO_BSE (Española)</option>
          <option value="RESO_SEDE_CENTRAL">RESO_SEDE_CENTRAL (Española)</option>
          <option value="RESO">RESO (SUISAS, lista única)</option>
          <option value="TC_SOLY">TC_SOLY (SUISAS)</option>
        </select>
        <button class="btn-warn" id="btn-excluir" style="width:100%;">Marcar que no participa en esta lista</button>
      </div>
    </details>
  </div>
</main>

<script>
const SUPABASE_URL = "https://lcnvdgjedxikpqxxyzqr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HAAHgNldQ3_wJH0EDrq3DA_u04xA7Yd";
let MES = "2026-10-01";
let MES_COORD = "2026-10";

function ultimoDiaMesStrCoord(mesYYYYMM) {
  const [anio, mes] = mesYYYYMM.split("-").map(Number);
  const ultimoDia = new Date(anio, mes, 0).getDate();
  return `${mesYYYYMM}-${String(ultimoDia).padStart(2, "0")}`;
}

async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
      ...(opts.headers || {})
    }
  });
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let personas = [];
let coordPassword = null;

const loginGate = document.getElementById("login-gate");
const loginTitulo = document.getElementById("login-titulo");
const loginTexto = document.getElementById("login-texto");
const loginInput = document.getElementById("login-input");
const loginInputConfirmar = document.getElementById("login-input-confirmar");
const loginBtn = document.getElementById("login-btn");
const loginError = document.getElementById("login-error");

async function iniciarLoginCoordinador() {
  const tiene = await sb(`rpc/tiene_password_coordinador`, { method: "POST", body: JSON.stringify({}) });
  const modoRegistro = tiene !== true;
  loginTitulo.textContent = modoRegistro ? "Creá la contraseña de coordinador" : "Ingresá la contraseña de coordinador";
  loginTexto.textContent = modoRegistro
    ? "Todavía no hay contraseña creada. Elegí una de al menos 6 caracteres — la va a necesitar cualquiera que quiera usar este panel."
    : "";
  loginInputConfirmar.style.display = modoRegistro ? "block" : "none";

  loginBtn.onclick = async () => {
    const pass = loginInput.value;
    loginError.textContent = "";
    if (modoRegistro) {
      if (pass.length < 6) { loginError.textContent = "Tiene que tener al menos 6 caracteres."; return; }
      if (pass !== loginInputConfirmar.value) { loginError.textContent = "Las dos contraseñas no coinciden."; return; }
      const ok = await sb(`rpc/registrar_password_coordinador`, {
        method: "POST",
        body: JSON.stringify({ p_password: pass })
      });
      if (ok === true) {
        coordPassword = pass;
        loginGate.style.display = "none";
        document.querySelector("main").style.display = "";
        iniciarApp();
      } else {
        loginError.textContent = "No se pudo crear la contraseña. Puede que ya exista una — recargá la página.";
      }
    } else {
      const ok = await sb(`rpc/verificar_password_coordinador`, {
        method: "POST",
        body: JSON.stringify({ p_password: pass })
      });
      if (ok === true) {
        coordPassword = pass;
        loginGate.style.display = "none";
        document.querySelector("main").style.display = "";
        iniciarApp();
      } else {
        loginError.textContent = "Contraseña incorrecta.";
      }
    }
  };
}
iniciarLoginCoordinador();

function sinTildes(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function cargarPersonas() {
  personas = await sb("perfiles?select=id,apellido,nombre,empresa&order=apellido.asc");
  const opciones = `<option value="">Seleccioná...</option>` +
    personas.map(p => `<option value="${p.id}">${[p.nombre, sinTildes(p.apellido)].filter(Boolean).join(" ")} (${p.empresa === "SUISAS" ? "SUISAS" : "Española"})</option>`).join("");
  document.getElementById("hab-persona").innerHTML = opciones;
  document.getElementById("exc-persona").innerHTML = opciones;
}

async function cargarProcesos() {
  const procesos = await sb(`procesos_convocatoria?select=id,grupo,tipo,estado,orden_actual,turno_vence,persona_actual_id&mes=eq.${MES}&order=grupo.asc,tipo.asc`);
  const wrap = document.getElementById("procesos-wrap");
  if (!procesos.length) {
    wrap.innerHTML = `<div class="status-msg">Todavía no arrancó ningún proceso este mes.</div>`;
    return;
  }
  wrap.innerHTML = procesos.map(p => {
    const persona = personas.find(x => x.id === p.persona_actual_id);
    const nombrePersona = persona ? [persona.nombre, sinTildes(persona.apellido)].filter(Boolean).join(" ") : "—";
    const vence = p.turno_vence ? new Date(p.turno_vence).toLocaleString("es-UY", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "—";
    const btn = p.estado === "PAUSADO"
      ? `<button class="btn-ok" data-accion="reanudar" data-grupo="${p.grupo}" data-tipo="${p.tipo}">Reanudar</button>`
      : p.estado === "ACTIVO"
      ? `<button class="btn-warn" data-accion="pausar" data-grupo="${p.grupo}" data-tipo="${p.tipo}">Pausar</button>`
      : "";
    return `
      <div class="proceso-row">
        <div class="proceso-info">
          <div class="titulo">${p.grupo} ${p.tipo === "NOCHEROS" ? "(nocheros)" : ""}</div>
          <div class="detalle">Turno actual: ${nombrePersona} · vence ${vence}</div>
        </div>
        <span class="estado-pill estado-${p.estado}">${p.estado}</span>
        ${btn}
      </div>`;
  }).join("");

  wrap.querySelectorAll("button[data-accion]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const fn = btn.dataset.accion === "pausar" ? "pausar_proceso" : "reanudar_proceso";
      await sb(`rpc/${fn}`, { method: "POST", body: JSON.stringify({ p_mes: MES, p_grupo: btn.dataset.grupo, p_tipo: btn.dataset.tipo }) });
      cargarProcesos();
    });
  });
}

async function cargarProcesosSuisas() {
  const rondas = await sb(`rondas_suisas?select=id,grupo,numero_ronda,cupo,estado,orden_actual,vence,persona_actual_id&mes=eq.${MES}&order=grupo.asc,numero_ronda.asc`);
  const wrap = document.getElementById("procesos-suisas-wrap");
  if (!rondas.length) {
    wrap.innerHTML = `<div class="status-msg">Todavía no arrancó ninguna ronda de SUISAS este mes.</div>`;
    return;
  }
  const rondaIds = rondas.map(r => r.id).join(",");
  const participaciones = rondaIds
    ? await sb(`participaciones_ronda_suisas?select=ronda_id,persona_id,cupo_ofrecido&ronda_id=in.(${rondaIds})`)
    : [];
  wrap.innerHTML = rondas.map(r => {
    const persona = personas.find(x => x.id === r.persona_actual_id);
    const nombrePersona = persona ? [persona.nombre, sinTildes(persona.apellido)].filter(Boolean).join(" ") : "—";
    const vence = r.vence ? new Date(r.vence).toLocaleString("es-UY", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "—";
    const partActual = participaciones.find(p => p.ronda_id === r.id && p.persona_id === r.persona_actual_id);
    const cupoReal = partActual ? partActual.cupo_ofrecido : r.cupo;
    const cupo = cupoReal != null ? `${Number(cupoReal)}hs` : "—";
    const btn = r.estado === "PAUSADA"
      ? `<button class="btn-ok" data-accion-suisas="reanudar" data-grupo="${r.grupo}">Reanudar</button>`
      : r.estado === "ACTIVA"
      ? `<button class="btn-warn" data-accion-suisas="pausar" data-grupo="${r.grupo}">Pausar</button>`
      : "";
    return `
      <div class="proceso-row">
        <div class="proceso-info">
          <div class="titulo">${r.grupo} <span class="tag-suisas">SUISAS · ronda ${r.numero_ronda}</span></div>
          <div class="detalle">Turno actual: ${nombrePersona} · cupo ${cupo} · vence ${vence}</div>
        </div>
        <span class="estado-pill estado-${r.estado}">${r.estado}</span>
        ${btn}
      </div>`;
  }).join("");

  wrap.querySelectorAll("button[data-accion-suisas]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const fn = btn.dataset.accionSuisas === "pausar" ? "pausar_ronda_suisas" : "reanudar_ronda_suisas";
      await sb(`rpc/${fn}`, { method: "POST", body: JSON.stringify({ p_mes: MES, p_grupo: btn.dataset.grupo }) });
      cargarProcesosSuisas();
    });
  });
}

document.getElementById("btn-habilitar").addEventListener("click", async () => {
  const grupo = document.getElementById("hab-grupo").value;
  const tipo = document.getElementById("hab-tipo").value;
  const personaId = document.getElementById("hab-persona").value;
  const msg = document.getElementById("hab-msg");
  if (!personaId) { msg.innerHTML = `<div class="msg-error">Elegí una persona.</div>`; return; }
  try {
    await sb(`rpc/coordinador_habilitar`, {
      method: "POST",
      body: JSON.stringify({ p_mes: MES, p_grupo: grupo, p_tipo: tipo, p_persona_id: personaId, p_password_coordinador: coordPassword })
    });
    msg.innerHTML = `<div class="msg-ok">✓ Habilitada en ${nombreMesEsCoord(MES_COORD)}, se le mandó la notificación.</div>`;
    cargarProcesos();
  } catch (e) {
    msg.innerHTML = `<div class="msg-error">Error: ${e.message}</div>`;
  }
});

document.getElementById("btn-excluir-todas").addEventListener("click", async () => {
  const personaId = document.getElementById("exc-persona").value;
  const msg = document.getElementById("exc-msg");
  if (!personaId) { msg.innerHTML = `<div class="msg-error">Elegí una persona.</div>`; return; }
  try {
    const listas = await sb(`rpc/marcar_no_participa_todas_listas`, {
      method: "POST",
      body: JSON.stringify({ p_persona_id: personaId, p_mes: MES, p_registrado_por: "COORDINADOR", p_password_coordinador: coordPassword })
    });
    msg.innerHTML = `<div class="msg-ok">✓ Excluida de ${nombreMesEsCoord(MES_COORD)} en: ${listas.join(", ")}. Si le tocaba el turno ahora en alguna, ya se la salteó.</div>`;
    cargarProcesos();
  } catch (e) {
    msg.innerHTML = `<div class="msg-error">Error: ${e.message}</div>`;
  }
});

document.getElementById("btn-excluir").addEventListener("click", async () => {
  const grupo = document.getElementById("exc-grupo").value;
  const personaId = document.getElementById("exc-persona").value;
  const msg = document.getElementById("exc-msg");
  if (!personaId) { msg.innerHTML = `<div class="msg-error">Elegí una persona.</div>`; return; }
  try {
    await sb(`rpc/marcar_no_participa`, {
      method: "POST",
      body: JSON.stringify({ p_persona_id: personaId, p_mes: MES, p_grupo: grupo, p_registrado_por: "COORDINADOR", p_password_coordinador: coordPassword })
    });
    msg.innerHTML = `<div class="msg-ok">✓ Excluida de ${nombreMesEsCoord(MES_COORD)} en la lista ${grupo}. Si estaba habilitada ahora, ya se la salteó.</div>`;
    cargarProcesos();
  } catch (e) {
    msg.innerHTML = `<div class="msg-error">Error: ${e.message}</div>`;
  }
});

const ZOOM_MIN_COORD = 0.3, ZOOM_MAX_COORD = 1.4, ZOOM_PASO_COORD = 0.1;
let coordZoom = Number(localStorage.getItem("convocate_zoom_coord")) || 0.6;

function aplicarZoomCoord() {
  const wrap = document.getElementById("coord-grilla-wrap");
  if (wrap) wrap.style.zoom = coordZoom;
  const btn = document.getElementById("btn-zoom-reset-coord");
  if (btn) btn.textContent = `${Math.round(coordZoom * 100)}%`;

async function cargarFeriadosCoord() {
  try {
    const feriados = await sbCoord(`feriados?select=fecha`);
    feriadosSet = new Set((feriados || []).map(f => f.fecha));
  } catch (e) {
    feriadosSet = new Set();
  }
}

async function cargarMesesDisponiblesCoord() {
  try {
    const [primero] = await sbCoord(`turnos?select=fecha&order=fecha.asc&limit=1`);
    const [ultimo] = await sbCoord(`turnos?select=fecha&order=fecha.desc&limit=1`);
    if (!primero || !ultimo) return;
    const meses = [];
    let [a, m] = primero.fecha.slice(0, 7).split("-").map(Number);
    const [aFin, mFin] = ultimo.fecha.slice(0, 7).split("-").map(Number);
    while (a < aFin || (a === aFin && m <= mFin)) {
      meses.push(`${a}-${String(m).padStart(2, "0")}`);
      m++; if (m > 12) { m = 1; a++; }
    }
    if (meses.length) MESES_DISPONIBLES_COORD = meses;
  } catch (e) { /* si falla, se queda con el default */ }
}

function nombreMesEsCoord(mesYYYYMM) {
  const NOMBRES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const [anio, mes] = mesYYYYMM.split("-").map(Number);
  const n = NOMBRES[mes - 1];
  return `${n.charAt(0).toUpperCase()}${n.slice(1)} ${anio}`;
}

function renderSelectorMesCoord() {
  const wrap = document.getElementById("coord-mes-selector");
  wrap.innerHTML = MESES_DISPONIBLES_COORD.map(m => {
    const activo = m === MES_COORD;

      ? "background:var(--primary);color:#fff;"
      : "background:var(--primary-soft);color:var(--primary);";
    return `<button data-mes="${m}" style="${estilo}">${nombreMesEsCoord(m)}</button>`;
  }).join("");
  wrap.querySelectorAll("button[data-mes]").forEach(btn => {
    btn.addEventListener("click", () => cambiarMesCoord(btn.dataset.mes));
  });
  const header = document.getElementById("header-mes-coord");
  if (header) header.textContent = `Panel del coordinador · ${nombreMesEsCoord(MES_COORD)}`;
}

async function cambiarMesCoord(mes) {

async function sbCoord(path, opts = {}) {
  const { headers: extraHeaders, ...restOpts } = opts;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...extraHeaders
    },
    ...restOpts
  });
  if (r.status === 204) return true;
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    const msg = (data && (data.message || data.error_description || data.hint)) || `Error ${r.status}`;
    throw new Error(msg);
  }
  return data;
}

  document.getElementById("coord-sector").value = "";

  wrap.innerHTML = `<div class="status-msg">Cargando vacantes...</div>`;

    `turnos?select=fecha,franjas_horarias(nombre,horas_reales,sectores(nombre))` +
    `&persona_id=is.null` +
    `&fecha=gte.${MES_COORD}-01&fecha=lte.${ultimoDiaMesStrCoord(MES_COORD)}&order=fecha.asc`
  );

  const nombresDia = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const porSector = {};
  for (const t of (filas || [])) {
    const sector = t.franjas_horarias?.sectores?.nombre;
    if (!sector || sector === "FOTOG") continue;
    if (!porSector[sector]) porSector[sector] = [];
    porSector[sector].push(t);
  }

  const sectoresConVacantes = Object.keys(porSector).sort();

  let html = `<div style="display:flex; justify-content:flex-start; margin-bottom:10px;">
    <button onclick="cerrarResumenVacantes()" title="Cerrar"
      style="width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:1rem; line-height:1; cursor:pointer; font-family:inherit;">✕</button>
  </div>`;

  if (!sectoresConVacantes.length) {
    html += `<div class="status-msg">No quedan turnos vacantes por cubrir en ningún sector.</div>`;
  }

  for (const sector of sectoresConVacantes) {
    const lista = porSector[sector].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const totalHoras = lista.reduce((acc, t) => acc + Number(t.franjas_horarias?.horas_reales || 0), 0);
    html += `<div style="margin-bottom:18px;">
      <div style="font-weight:700; font-size:0.9rem; margin-bottom:6px;">${sector} — ${totalHoras}hs vacantes</div>`;
    for (const t of lista) {
      const d = new Date(t.fecha + "T12:00:00");
      const dia = nombresDia[d.getDay()];
      const fechaCorta = t.fecha.slice(8, 10) + "/" + t.fecha.slice(5, 7);

      html += `<div style="background:#FFF9C4; color:#7B6000; font-weight:600; padding:6px 10px; border-radius:8px; margin-bottom:4px; font-size:0.8rem;">
        ${dia} ${fechaCorta} · ${franja}
      </div>`;
    }
    html += `</div>`;
  }

  wrap.innerHTML = html;
}

function textoEncabezadoExport(estructura, col, sector) {
  for (let r = estructura.first_day_row - 1; r >= 0; r--) {
    const v = estructura.filas[r][col]?.v;
    if (v && String(v).trim() !== "") {
      const raw = String(v).trim();
      if (sector) {
        const mapped = HEADER_MAP_EXPORT[`${sector}|${raw.toUpperCase()}`]
                    || HEADER_MAP_EXPORT[`${sector}|${raw}`];
        if (mapped) return mapped;
      }
      return raw;
    }
  }
  return "";
}

async function obtenerTurnosSectorExport(sector, mesCoord) {
  const sectores = await sbCoord(`sectores?select=id,nombre&nombre=eq.${sector}`);
  if (!sectores || !sectores.length) return [];
  const sectorId = sectores[0].id;
  let lista = [];
  let desde = 0;
  while (true) {
    const pag = await sbCoord(
      `turnos?select=id,fecha,col_excel,persona_id,nombre_externo,` +
      `franjas_horarias!inner(nombre,sector_id,sectores!inner(nombre)),perfiles!turnos_persona_id_fkey(apellido,nombre,empresa,ficha)` +
      `&franjas_horarias.sector_id=eq.${sectorId}` +
      `&fecha=gte.${mesCoord}-01&fecha=lte.${ultimoDiaMesStrCoord(mesCoord)}&order=id.asc`,
      { headers: { "Range-Unit": "items", Range: `${desde}-${desde+999}` } }
    );
    if (!pag || !pag.length) break;
    lista.push(...pag);
    if (pag.length < 1000) break;
    desde += 1000;
  }
  return lista;
}

// Calcula contenido + estilo de una celda replicando EXACTAMENTE la
// lógica de renderGrilla() en index.html (sin las ramas que dependen de
// quién está logueado, porque acá no hay un suplente puntual mirando).
function calcularCeldaExport({ sector, estructura, turnosLista, r, c, mesCoord, feriadosSet }) {
  const { filas, dia_col, first_day_row, last_day_row, columnas_grises } = estructura;
  const setColumnasGrises = Array.isArray(columnas_grises) ? new Set(columnas_grises) : null;
  const celda = filas[r][c];

  const esFilaDeDia = r >= first_day_row && r <= last_day_row;
  let dia = esFilaDeDia ? filas[r][dia_col]?.v : null;

  let grisFila = false;
  if (esFilaDeDia && typeof dia === "number") {
    const fechaStr = `${mesCoord}-${String(dia).padStart(2, "0")}`;
    const d = new Date(fechaStr + "T12:00:00");
    const diaSemana = ((d.getDay() + 6) % 7) + 1;
    const esFinde = diaSemana === 6 || diaSemana === 7;
    const esFeriado = feriadosSet.has(fechaStr) && sector !== "BSE";
    grisFila = esFinde || esFeriado;
  }

  let contenido = celda.v ?? "";
  let bg = null, color = null, negrita = !!celda.bold;

  if ((esFilaDeDia || r > last_day_row) && typeof celda.v === "number" && celda.v >= 1 && celda.v <= 31) {
    if (!setColumnasGrises || setColumnasGrises.has(c)) {
      if (grisFila) bg = "A6A6A6"; else bg = "BDD7EE";
    }
  } else if ((esFilaDeDia || r > last_day_row) && typeof celda.v === "string" && /^\d{1,2}\s*A\s*\d{1,2}$/i.test(celda.v.trim())) {
    contenido = celda.v;
  } else if (esFilaDeDia) {
    let diaLocal = dia;
    if (sector === "TC") {
      const posibleDia = filas[r][c - 1]?.v;
      if (typeof posibleDia === "number" && posibleDia >= 1 && posibleDia <= 31) diaLocal = posibleDia;
    }
    const t = turnosLista.find(x => Number(x.fecha.slice(8,10)) === diaLocal && x.col_excel === (100 + r))
      || turnosLista.find(x => Number(x.fecha.slice(8,10)) === diaLocal && x.col_excel === c)
      || turnosLista.find(x => Number(x.fecha.slice(8,10)) === dia && (x.franjas_horarias?.nombre || "").trim() === textoEncabezadoExport(estructura, c, sector));

    const esSuisasDirecto = t && !t.persona_id && t.nombre_externo === "SUISAS_DIRECTO";

    if (esSuisasDirecto) {
      contenido = "SUISAS"; color = "00C853"; negrita = false;
    } else if (t && (t.persona_id || t.nombre_externo)) {
      contenido = t.perfiles ? nombreAsignadoExport(t.perfiles) : sinTildes(t.nombre_externo).toUpperCase();
    } else if (t) {
      if (sector === "FOTOG") { contenido = ""; }
      else { contenido = "LIBRE"; color = "00C853"; negrita = true; }
    } else if (celda.v) {
      contenido = sinTildes(String(celda.v)).toUpperCase();
    } else if (!grisFila && c !== dia_col && (!setColumnasGrises || setColumnasGrises.has(c))) {
      contenido = "X";
    } else {
      contenido = "";
    }
  }

  if (grisFila && (setColumnasGrises ? setColumnasGrises.has(c) : true)) bg = "A6A6A6";
  if (celda.g && !bg) bg = "A6A6A6";

  return { celda, contenido, bg, color, negrita };
}

function calcularCeldaGuardiaTCExport({ sector, estructura, turnosLista, r, c, mesCoord }) {
  if (sector !== "TC" || r < 14 || r > 50 || (c !== 12 && c !== 13)) return null;
  const { filas } = estructura;
  const diaG = filas[r][14]?.v;
  const horarioG = (filas[r][15]?.v || "").toString().trim();
  if (typeof diaG !== "number" || !horarioG) return { contenido: "", bg: null, color: null, negrita: false };

  const fechaG = `${mesCoord}-${String(diaG).padStart(2, "0")}`;
  const tG = turnosLista.find(t =>
    t.fecha === fechaG && (t.franjas_horarias?.nombre || "").trim() === horarioG
  );
  const esSuisasDirectoG = tG && !tG.persona_id && tG.nombre_externo === "SUISAS_DIRECTO";

  let contenido = "", color = null, negrita = false;

  if (c === 12) {
    if (tG && tG.persona_id && tG.perfiles) contenido = tG.perfiles.ficha != null ? String(tG.perfiles.ficha) : "";
    else if (esSuisasDirectoG) { contenido = "SUISAS"; color = "00C853"; }
    else if (tG && tG.nombre_externo) contenido = sinTildes(tG.nombre_externo).toUpperCase();
    else if (tG) { contenido = "LIBRE"; color = "00C853"; negrita = true; }
  } else if (tG) {
    if (esSuisasDirectoG) { contenido = "SUISAS"; color = "00C853"; }
    else if (tG.persona_id || tG.nombre_externo) {
      contenido = tG.perfiles ? nombreAsignadoExport(tG.perfiles) : sinTildes(tG.nombre_externo).toUpperCase();
    } else { contenido = "LIBRE"; color = "00C853"; negrita = true; }
  }
  return { contenido, bg: null, color, negrita };
}

async function exportarPlanillaPublica() {
  const btn = document.getElementById("btn-exportar-excel");
  const original = btn.textContent;
  btn.disabled = true;

  try {
    const workbook = new ExcelJS.Workbook();

    for (const sector of SECTORES_EXPORT_PUBLICA) {
      btn.textContent = `Generando ${sector}...`;
      const hojas = await sbCoord(`hojas_excel?select=estructura&sector=eq.${sector}&mes=eq.${MES_COORD}-01`);
      if (!hojas || !hojas.length) continue;

      const estructura = hojas[0].estructura;
      const { cols, merges, filas, ultima_col_real, first_day_row } = estructura;
      const totalCols = (typeof ultima_col_real === "number") ? ultima_col_real + 1 : cols.length;
      const turnosLista = await obtenerTurnosSectorExport(sector, MES_COORD);

      const ws = workbook.addWorksheet(sector.substring(0, 31));
      for (let i = 0; i < totalCols; i++) ws.getColumn(i + 1).width = cols[i] || 8;

      const skip = new Set();
      for (const m of merges) {
        ws.mergeCells(m.r1, m.c1, m.r2, m.c2);
        for (let r = m.r1 - 1; r <= m.r2 - 1; r++)
          for (let c = m.c1 - 1; c <= m.c2 - 1; c++)
            if (!(r === m.r1 - 1 && c === m.c1 - 1)) skip.add(`${r}-${c}`);
      }

      for (let r = 0; r < filas.length; r++) {
        for (let c = 0; c < totalCols; c++) {
          if (skip.has(`${r}-${c}`)) continue;

          let resultado = calcularCeldaGuardiaTCExport({ sector, estructura, turnosLista, r, c, mesCoord: MES_COORD });
          let celda = filas[r][c];
          if (!resultado) {
            resultado = calcularCeldaExport({ sector, estructura, turnosLista, r, c, mesCoord: MES_COORD, feriadosSet });
            celda = resultado.celda;
          }

          const { contenido, bg, color, negrita } = resultado;

          const cell = ws.getCell(r + 1, c + 1);
          cell.value = contenido === "" ? null : contenido;
          if (bg) cell.fill = hexFillExport(bg);
          cell.font = { bold: negrita, color: color ? { argb: "FF" + color } : undefined };
          cell.alignment = { vertical: "middle", horizontal: "center" };

          const esEnc = r < first_day_row;
          if (!esEnc && celda?.bd) {
            const bd = celda.bd;
            cell.border = {
              top: bd.t ? { style: "thin" } : undefined,
              bottom: bd.b ? { style: "thin" } : undefined,
              left: bd.l ? { style: "thin" } : undefined,
              right: bd.r ? { style: "thin" } : undefined,
            };
          }
        }
      }
    }

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Planilla_publica_${MES_COORD}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert("No se pudo generar el Excel: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function renderGrillaCoord() {
  const { cols, merges, filas, dia_col, first_day_row, last_day_row, ultima_col_real, columnas_grises } = coordEstructura;
  const totalCols = ultima_col_real + 1;
  const setGrises = Array.isArray(columnas_grises) ? new Set(columnas_grises) : null;

  const porCelda = {};
  for (const t of coordTurnos) {
    const dia = Number(t.fecha.slice(8,10));
    if (t.col_excel != null) porCelda[`${dia}-${t.col_excel}`] = t;
  }

  const mergeMap = {};
  const skip = new Set();
  for (const m of merges) {
    mergeMap[`${m.r1-1}-${m.c1-1}`] = { rowspan: m.r2-m.r1+1, colspan: m.c2-m.c1+1 };
    for (let r = m.r1-1; r <= m.r2-1; r++)
      for (let c = m.c1-1; c <= m.c2-1; c++)
        if (!(r === m.r1-1 && c === m.c1-1)) skip.add(`${r}-${c}`);
  }

  let html = `<table style="border-collapse:collapse;font-size:0.72rem;table-layout:fixed;width:max-content;"><colgroup>`;
  for (let i = 0; i < totalCols; i++) {
    const w = anchoCoord(cols[i]);
    html += `<col style="width:${w}px">`;
  }
  html += `</colgroup><tbody>`;

  for (let r = 0; r < filas.length; r++) {
    html += `<tr>`;
    for (let c = 0; c < totalCols; c++) {
      if (skip.has(`${r}-${c}`)) continue;
      const celda = filas[r][c];
      const span = mergeMap[`${r}-${c}`];
      const attrs = span ? ` rowspan="${span.rowspan}" colspan="${span.colspan}"` : "";
      const bd = celda.bd;
      const esEnc = r < first_day_row;
      const borde = esEnc ? "border:none;" :
        `border-top:${bd.t?"1px solid #000":"none"};border-bottom:${bd.b?"1px solid #000":"none"};border-left:${bd.l?"1px solid #000":"none"};border-right:${bd.r?"1px solid #000":"none"};`;

      let esFilaDia = r >= first_day_row && r <= last_day_row;
      let dia = esFilaDia ? filas[r][dia_col]?.v : null;
      let contenido = celda.v ?? "";
      let bg = "background:#fff;";
      let cursor = "";
      let dataAttr = "";

      let esGrisFinde = false;
      if (esFilaDia && typeof dia === "number") {
        const mesBase = MES.slice(0, 7);
        const fechaStr = `${mesBase}-${String(dia).padStart(2, "0")}`;
        const d = new Date(fechaStr + "T12:00:00");
        const diaSemana = ((d.getDay() + 6) % 7) + 1;
        const esFinde = diaSemana === 6 || diaSemana === 7;
        const esFeriado = feriadosSet.has(fechaStr) && coordSectorActual !== "BSE";
        esGrisFinde = esFinde || esFeriado;
      }

      if (esFilaDia && setGrises && !setGrises.has(c)) {
        // columna fuera de tabla — no clickeable
      } else if (esFilaDia && c !== dia_col && typeof dia === 'number') {
        const key = `${dia}-${c}`;
        const turno = porCelda[key];
        if (turno) {
          if (turno.persona_id) {
            const apAmbiguos = new Set(["Alegre", "Ferreira", "Gonzalez", "Gutierrez", "Martinez", "Rodriguez"]);
            const apSinTildes = sinTildes(turno.perfiles?.apellido || "").trim();
            const esAmbiguo = apAmbiguos.has(apSinTildes);
            contenido = turno.perfiles
              ? sinTildes(turno.perfiles.apellido||"").toUpperCase()
                + (esAmbiguo && turno.perfiles.nombre ? " " + sinTildes(turno.perfiles.nombre).trim().charAt(0).toUpperCase() : "")
                + (turno.perfiles.empresa === "SUISAS" ? " (S)" : "")
              : "ASIGNADO";
            bg = "background:#E3F0E8;";
          } else {
            if (turno.nombre_externo === "SUISAS_DIRECTO") {
              contenido = "SUISAS";
              bg = "background:#DCEEFF;color:#0B5394;font-weight:normal;";
            } else {
              contenido = "LIBRE";
              bg = "background:#FFF9C4;color:#7B6000;font-weight:700;";
            }
          }
          cursor = "cursor:pointer;";
          dataAttr = ` data-dia="${dia}" data-col="${c}" data-turno-id="${turno.id}"`;
        } else if (celda.y) {
          contenido = "—";
          bg = "background:#FFF9C4;";
          cursor = "cursor:pointer;";
          dataAttr = ` data-dia="${dia}" data-col="${c}" data-turno-id=""`;
        } else if (celda.v && !celda.g) {
          contenido = String(celda.v);
          cursor = "cursor:pointer;";
          dataAttr = ` data-dia="${dia}" data-col="${c}" data-turno-id="" data-valor="${String(celda.v)}"`;
        } else if (!celda.g) {
          cursor = "cursor:pointer;";
          dataAttr = ` data-dia="${dia}" data-col="${c}" data-turno-id=""`;
        }
      }

      let esGuardiaTCEspecial = false;
      if (coordSectorActual === "TC" && r >= 14 && r <= 50 && (c === 13 || c === 12)) {
        esGuardiaTCEspecial = true;
        const diaG = filas[r][14]?.v;
        const horarioG = (filas[r][15]?.v || "").toString().trim();
        if (typeof diaG === "number" && horarioG) {
          const mesBase = MES.slice(0, 7);
          const fechaG = `${mesBase}-${String(diaG).padStart(2, "0")}`;
          const turnoG = coordTurnos.find(t =>
            t.fecha === fechaG && (t.franjas_horarias?.nombre || "").trim() === horarioG
          );
          bg = "background:#fff;";
          if (c === 12) {
            if (turnoG && turnoG.persona_id && turnoG.perfiles) {
              contenido = turnoG.perfiles.ficha != null ? String(turnoG.perfiles.ficha) : "";
              bg = "background:#E3F0E8;";
            } else if (turnoG) {
              contenido = "LIBRE";
              bg = "background:#FFF9C4;color:#7B6000;font-weight:700;";
            } else {
              contenido = "";
            }
          } else if (turnoG) {
            if (turnoG.persona_id) {
              contenido = turnoG.perfiles
                ? sinTildes(turnoG.perfiles.apellido||"").toUpperCase() + (turnoG.perfiles.empresa === "SUISAS" ? " (S)" : "")
                : "ASIGNADO";
              bg = "background:#E3F0E8;";
            } else {
              contenido = "LIBRE";
              bg = "background:#FFF9C4;color:#7B6000;font-weight:700;";
            }
            cursor = "cursor:pointer;";
            dataAttr = ` data-dia="${diaG}" data-col="-1" data-turno-id="${turnoG.id}"`;
          } else {
            contenido = "";
          }
        }
      }

      const bold = celda.bold ? "font-weight:700;" : "";
      if (esGrisFinde && !esGuardiaTCEspecial && setGrises && setGrises.has(c)) bg = "background:#A6A6A6;";
      const tieneBordes = bd.t && bd.b && bd.l && bd.r ? "1" : "0";
      const dataEditar = ` data-editar-sector="${coordSectorActual}" data-editar-fila="${r}" data-editar-col="${c}" data-editar-bordes="${tieneBordes}"`;
      html += `<td${attrs}${dataAttr}${dataEditar} style="padding:3px 5px;text-align:center;vertical-align:middle;${borde}${bg}${bold}${cursor}height:22px;">${contenido}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  const wrap = document.getElementById("coord-grilla-wrap");
  wrap.innerHTML = html;

  wrap.querySelectorAll("td[data-dia]").forEach(td => {
    td.addEventListener("click", () => abrirModalCelda(td));
  });

  wrap.querySelectorAll("td[data-editar-fila]").forEach(td => {
    td.addEventListener("dblclick", async () => {
      const fila = Number(td.dataset.editarFila);
      const col = Number(td.dataset.editarCol);
      const teniaBordes = td.dataset.editarBordes === "1";
      const actual = td.textContent.trim();
      const nuevo = window.prompt("Editar texto de esta celda:", actual);
      if (nuevo === null) return;
      const conBordes = window.confirm(
        `¿Esta celda debe tener el recuadro de bordes (como el resto de la tabla)?\n\n` +
        `Ahora mismo: ${teniaBordes ? "SÍ tiene bordes" : "NO tiene bordes"}.\n\n` +
        `Aceptar = poner bordes. Cancelar = dejar sin bordes.`
      );
      const ok = await sbCoord(`rpc/editar_texto_celda_excel`, {
        method: "POST",
        body: JSON.stringify({
          p_sector: coordSectorActual,
          p_fila: fila,
          p_col: col,
          p_nuevo_texto: nuevo === "" ? null : nuevo,
          p_bordes: conBordes,
          p_password_coordinador: coordPassword,
          p_mes: `${MES_COORD}-01`
        })
      });
      if (ok !== false) {
        const hojas = await sbCoord(`hojas_excel?select=estructura&sector=eq.${coordSectorActual}&mes=eq.${MES_COORD}-01`);
        if (hojas && hojas.length) coordEstructura = hojas[0].estructura;
        renderGrillaCoord();
      } else {
        alert("No se pudo guardar el cambio.");
      }
    });
  });
}

function anchoCoord(w) {
  const px = Math.round((w || 8) * 7 + 5);
  return px < 60 ? px : 80;
}

function abrirModalCelda(td) {
  celdaSeleccionada = {
    dia: Number(td.dataset.dia),
    col: Number(td.dataset.col),
    turnoId: td.dataset.turnoId ? Number(td.dataset.turnoId) : null,
    valorActual: td.dataset.valor || td.textContent.trim()
  };

  const turno = coordTurnos.find(t => t.id === celdaSeleccionada.turnoId);
  const titulo = document.getElementById("coord-modal-titulo");

  const contenidoActual = celdaSeleccionada.valorActual || "—";
  titulo.textContent = `Día ${celdaSeleccionada.dia} · ${contenidoActual}`;

  const btnActivar       = document.getElementById("coord-btn-activar");
  const btnVacante       = document.getElementById("coord-btn-vacante");
  const btnVacanteSuisas = document.getElementById("coord-btn-vacante-suisas");
  const btnQuitarSuisas  = document.getElementById("coord-btn-quitar-suisas");
  const wrapAsignar      = document.getElementById("coord-asignar-wrap");
  const btnDesactivar    = document.getElementById("coord-btn-desactivar");

  btnActivar.style.display = "none";
  btnVacante.style.display = "none";
  btnVacanteSuisas.style.display = "none";
  btnQuitarSuisas.style.display = "none";
  wrapAsignar.style.display = "none";
  btnDesactivar.style.display = "none";

  if (!turno) {
    btnActivar.style.display = "block";
    btnVacante.style.display = "none";
    wrapAsignar.style.display = "block";
    if (celdaSeleccionada.valorActual && celdaSeleccionada.valorActual !== "—" && celdaSeleccionada.valorActual !== "") {
      btnDesactivar.style.display = "block";
      btnDesactivar.textContent = "✗ Dejar sin convocatoria";
    } else {
      btnDesactivar.style.display = "none";
    }
  } else if (!turno.persona_id) {
    btnActivar.style.display = "none";
    btnVacante.style.display = "none";
    wrapAsignar.style.display = "block";
    btnDesactivar.style.display = "block";
    btnDesactivar.textContent = "✗ Quitar de convocatoria";
    if (turno.nombre_externo === "SUISAS_DIRECTO") {
      btnQuitarSuisas.style.display = "block";
    } else {
      btnVacanteSuisas.style.display = "block";
    }
  } else {
    btnActivar.style.display = "none";
    btnVacante.style.display = "block";
    btnVacanteSuisas.style.display = "block";
    wrapAsignar.style.display = "block";
    btnDesactivar.style.display = "block";
    btnDesactivar.textContent = "✗ Dejar sin convocatoria";
  }

  document.getElementById("coord-modal").style.display = "flex";
}

async function recargarTurnos() {
  const sectores = await sbCoord(`sectores?select=id,nombre&nombre=eq.${coordSectorActual}`);
  if (!sectores || !sectores.length) return;
  const sectorId = sectores[0].id;

  coordTurnos = [];
  let desde = 0;
  while (true) {
    const pag = await sbCoord(
      `turnos?select=id,fecha,col_excel,persona_id,origen_vacante,nombre_externo,` +
      `franjas_horarias!inner(nombre,sector_id,sectores!inner(nombre)),perfiles!turnos_persona_id_fkey(apellido,nombre,empresa,ficha)` +
      `&franjas_horarias.sector_id=eq.${sectorId}` +
      `&fecha=gte.${MES_COORD}-01&fecha=lte.${ultimoDiaMesStrCoord(MES_COORD)}&order=id.asc`,
      { headers: { "Range-Unit": "items", Range: `${desde}-${desde+999}` } }
    );
    if (!pag || !pag.length) break;
    coordTurnos.push(...pag);
    if (pag.length < 1000) break;
    desde += 1000;
  }
  renderGrillaCoord();
}


let solicitudesPendientes = [];

async function cargarSolicitudes() {
  const data = await sb(
    `solicitudes_cambio_detalle?estado=eq.PENDIENTE`
  );
  solicitudesPendientes = data || [];
  const wrap = document.getElementById("solicitudes-wrap");
  if (!data || !data.length) {
    wrap.innerHTML = `<p style="color:var(--ink-soft);font-size:0.85rem;">No hay solicitudes pendientes.</p>`;
    return;
  }
  wrap.innerHTML = data.map(s => `
    <div style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;">
      <div style="font-weight:700;">${sinTildes(s.solicitante_apellido)} → cede a ${sinTildes(s.cobertura_apellido)}</div>
      <div style="font-size:0.85rem;color:var(--ink-soft);">
        ${s.fecha.slice(8,10)}/${s.fecha.slice(5,7)} — ${s.sector} ${s.franja}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button onclick="resolverSolicitud(${s.id}, true)"
          style="flex:1;padding:8px;background:#2e7d32;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;">
          ✓ Autorizar
        </button>
        <button onclick="resolverSolicitud(${s.id}, false)"
          style="flex:1;padding:8px;background:#c62828;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;">
          ✗ Rechazar
        </button>
      </div>
    </div>
  `).join("");
}

async function resolverSolicitud(id, aprobar) {
  const solicitud = solicitudesPendientes.find(s => s.id === id);
  const ok = await sb(`rpc/resolver_solicitud_cambio`, {
    method: "POST",
    body: JSON.stringify({ p_solicitud_id: id, p_aprobar: aprobar, p_password_coordinador: coordPassword })
  });
  if (ok === true) {
    if (aprobar && solicitud) {
      try {
        await generarYDescargarFormulario(solicitud);
      } catch (e) {
        alert("El cambio se aprobó bien, pero hubo un problema generando el formulario para imprimir: " + e.message);
      }
    }
    await cargarSolicitudes();
  } else {
    alert("Error al resolver la solicitud.");
  }
}

// ---------------------------------------------------------
// Generación del formulario de cobertura (Libre Particular o
// Rechazo de Convocatoria) al aprobar un cambio. Corre en el
// navegador con pdf-lib; el logo y la firma de Cesar van
// embebidos como base64 más abajo, en ASSETS_FORMULARIOS.
// Elige la plantilla según solicitante_es_titular: true -> Libre
// Particular (titulares), false/null -> Rechazo de Convocatoria
// (suplentes). El campo Motivo y, en Libre Particular, el
// checkbox Proveedor/Dependiente/Ambos quedan en blanco a
// propósito para completar a mano — nunca se autocompletan.
// ---------------------------------------------------------
function formatearFechaCorta(fechaYYYYMMDD) {
  const [a, m, d] = fechaYYYYMMDD.split("-");
  return `${d}/${m}/${a}`;
}

function sumarUnDia(fechaYYYYMMDD) {
  const d = new Date(fechaYYYYMMDD + "T12:00:00");
  d.setDate(d.getDate() + 1);
  const a = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${dd}/${m}/${a}`;
}

async function generarYDescargarFormulario(s) {
  const esTitular = s.solicitante_es_titular === true;
  const horaInicio = s.hora_inicio;
  const horaFin = s.hora_fin;
  const cruzaMedianoche = horaFin != null && horaInicio != null && horaFin <= horaInicio;

  const fechaDesde = formatearFechaCorta(s.fecha);
  const fechaHastaCorta = cruzaMedianoche ? sumarUnDia(s.fecha) : fechaDesde;

  const desdeTxt = horaInicio != null ? `${fechaDesde} ${String(horaInicio).padStart(2,"0")}:00` : fechaDesde;
  const alTxt = horaFin != null ? `${fechaHastaCorta} ${String(horaFin).padStart(2,"0")}:00` : fechaHastaCorta;

  const datos = {
    tipo: esTitular ? "LP" : "RC",
    cubre: `${sinTildes(s.cobertura_nombre || "")} ${sinTildes(s.cobertura_apellido || "")}`.trim() + (s.cobertura_ficha != null ? ` (ficha ${s.cobertura_ficha})` : ""),
    fecha: new Date().toLocaleDateString("es-UY"),
    desde: desdeTxt,
    al: alTxt,
    actividad: `${s.sector} - ${s.franja}`,
    ficha: s.solicitante_ficha != null ? String(s.solicitante_ficha) : "",
    nombre: `${sinTildes(s.solicitante_nombre || "")} ${sinTildes(s.solicitante_apellido || "")}`.trim(),
    cargo: s.solicitante_cargo || "Licenciado en Imagenología",
  };

  const bytes = await generarFormularioPDF(datos);
  const nombreArchivo = (datos.tipo === "LP" ? "LIBRE_PARTICULAR_" : "RECHAZO_CONVOCATORIA_") + datos.ficha + "_" + s.fecha + ".pdf";
  descargarPDF(bytes, nombreArchivo);
}

function descargarPDF(bytes, nombreArchivo) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  a.click();
  URL.revokeObjectURL(url);
}

function b64ToBytesFormulario(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function generarFormularioPDF(datos) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const MM = 2.834645669;
  const mm = (v) => v * MM;
  const page = pdfDoc.addPage([mm(210), mm(297)]);
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const logoImg = await pdfDoc.embedPng(b64ToBytesFormulario(ASSETS_FORMULARIOS.logo));
  const firmaImg = await pdfDoc.embedPng(b64ToBytesFormulario(ASSETS_FORMULARIOS.firma));

  let y = mm(297) - mm(15);

  function text(t, x, yy, opts) {
    opts = opts || {};
    page.drawText(t, { x: mm(x), y: yy, size: opts.size || 9.5, font: opts.bold ? fontBold : font, color: rgb(0,0,0) });
  }
  function centered(t, xCenterMm, yy, opts) {
    opts = opts || {};
    const size = opts.size || 10;
    const f = opts.bold ? fontBold : font;
    const width = f.widthOfTextAtSize(t, size);
    page.drawText(t, { x: mm(xCenterMm) - width / 2, y: yy, size, font: f, color: rgb(0,0,0) });
  }
  function line(x1, x2, yy) {
    page.drawLine({ start: { x: mm(x1), y: yy }, end: { x: mm(x2), y: yy }, thickness: 0.75, color: rgb(0,0,0) });
  }

  const tipo = datos.tipo;

  // Cubre (arriba a la derecha)
  text("Cubre:", 115, y, { bold: true, size: 12 });
  line(133, 185, y - mm(1.5));
  text(datos.cubre, 135, y, { size: 11 });
  y -= mm(9);

  // Logo
  const logoW = mm(75);
  const logoH = logoW * (logoImg.height / logoImg.width);
  page.drawImage(logoImg, { x: mm(20), y: y - logoH, width: logoW, height: logoH });
  y -= logoH + mm(6);

  if (tipo === "LP") {
    centered("BOLETA DE SOLICITUD DE LICENCIA PARTICULAR SIN GOCE DE SUELDO", 105, y, { bold: true, size: 12 });
    y -= mm(7);
    centered("PERSONAL TECNICO", 105, y, { bold: true, size: 11 });
  } else {
    centered("FORMULARIO DE SOLICITUD DE RENUNCIA A CONVOCATORIAS PARA", 105, y, { bold: true, size: 11 });
    line(25, 185, y - mm(1.5));
    y -= mm(12);
    centered("MEDICOS Y TECNICOS SUPLENTES", 105, y, { bold: true, size: 11 });
    line(65, 145, y - mm(1.5));
  }
  y -= mm(12);

  if (tipo === "LP") {
    text("Fecha:", 150, y);
    line(163, 185, y - mm(1));
    centered(datos.fecha, 174, y, { size: 10 });
  } else {
    text("Proveedor", 20, y);
    page.drawRectangle({ x: mm(45), y: y - mm(2.5), width: mm(4), height: mm(4), borderWidth: 1, borderColor: rgb(0,0,0) });
    text("Dependiente", 65, y);
    page.drawRectangle({ x: mm(92), y: y - mm(2.5), width: mm(4), height: mm(4), borderWidth: 1, borderColor: rgb(0,0,0) });
    text("FECHA", 140, y, { bold: true });
    line(155, 185, y - mm(1));
    centered(datos.fecha, 170, y, { size: 10 });
  }
  y -= mm(14);

  if (tipo === "LP") {
    text("Solicito licencia particular sin goce de sueldo  desde el", 20, y);
    line(105, 140, y - mm(1)); centered(datos.desde, 122.5, y, { size: 10 });
    text("al", 142, y);
    line(148, 185, y - mm(1)); centered(datos.al, 166.5, y, { size: 10 });
    y -= mm(12);
    text("En mi actividad de", 20, y);
    line(55, 185, y - mm(1)); text(datos.actividad, 57, y, { size: 10 });
    y -= mm(12);
    text("Proveedor", 20, y); page.drawRectangle({ x: mm(42), y: y - mm(2.5), width: mm(4), height: mm(4), borderWidth: 1, borderColor: rgb(0,0,0) });
    text("Dependiente", 60, y); page.drawRectangle({ x: mm(85), y: y - mm(2.5), width: mm(4), height: mm(4), borderWidth: 1, borderColor: rgb(0,0,0) });
    text("Ambos", 105, y); page.drawRectangle({ x: mm(122), y: y - mm(2.5), width: mm(4), height: mm(4), borderWidth: 1, borderColor: rgb(0,0,0) });
    y -= mm(12);
    text("Motivo:", 20, y); line(35, 185, y - mm(1));
    y -= mm(9);
    text("De acuerdo a la reglamentacion vigente declaro conocer que esta solicitud queda supeditada a la ubicacion", 20, y, { size: 9 });
    y -= mm(5);
    text("de un medico suplente que me subrogue. A estos efectos me informare personalmente o por telefono al", 20, y, { size: 9 });
    y -= mm(5);
    text("1920 - 6100.", 20, y, { size: 9 });
    y -= mm(8);
  } else {
    text("SOLICITO SE ME EXIMA DE REALIZAR LA CONVOCATORIA PREVIAMENTE ACEPTADA", 20, y, { bold: true });
    y -= mm(12);
    text("DESDE:", 20, y, { bold: true }); line(35, 130, y - mm(1)); text(datos.desde, 37, y, { size: 10 });
    y -= mm(11);
    text("HASTA:", 20, y, { bold: true }); line(35, 130, y - mm(1)); text(datos.al, 37, y, { size: 10 });
    y -= mm(11);
    text("ACTIVIDAD:", 20, y, { bold: true }); line(42, 185, y - mm(1)); text(datos.actividad, 44, y, { size: 10 });
    y -= mm(9); line(20, 185, y);
    y -= mm(12);
    text("MOTIVO:", 20, y, { bold: true }); line(38, 185, y - mm(1));
    y -= mm(14);
    text("ESTA SOLICITUD QUEDA SUPEDITADA A CONSEGUIR UN SUPLENTE  QUE ME SUBROGUE", 20, y, { bold: true, size: 9.5 });
    y -= mm(5.5);
    text("A ESTOS EFECTOS ME INFORMARE PERSONALMENTE O POR TELEFONO AL 19206100.-", 20, y, { bold: true, size: 9.5 });
    y -= mm(10);
  }

  // N registro / Nombre
  line(20, 85, y); line(110, 185, y);
  text(tipo === "LP" ? "N° Registro" : "N registro", 20, y - mm(5), { size: 9 });
  centered(tipo === "LP" ? "Nombres y apellidos en letra imprenta" : "Nombres y apellidos en letra de imprenta", 147.5, y - mm(5), { size: 9 });
  centered(datos.ficha, 52.5, y + mm(1.5));
  centered(datos.nombre, 147.5, y + mm(1.5));
  y -= mm(20);

  // Cargo / Firma habitual
  line(20, 85, y); line(110, 185, y);
  text("Cargo", 20, y - mm(5), { size: 9 });
  centered("Firma habitual", 147.5, y - mm(5), { size: 9 });
  centered(datos.cargo, 52.5, y + mm(1.5));
  y -= mm(26);

  // Firma de Cesar (arriba del renglon, centrada)
  const firmaW = mm(26);
  const firmaH = firmaW * (firmaImg.height / firmaImg.width);
  const cx = tipo === "LP" ? 85 : 100;
  page.drawImage(firmaImg, { x: mm(cx - firmaW / (2 * MM)), y: y + mm(6), width: firmaW, height: firmaH });
  centered("LIC. CESAR RODRIGUEZ", cx, y + mm(7), { bold: true, size: 7.5 });
  centered("JEFE TECNICO DE IMAGENOLOGIA", cx, y + mm(3.5), { size: 7.5 });

  if (tipo === "LP") {
    text("V B Jefe de Servicio:", 20, y); line(60, 110, y - mm(1));
    text("VB Direccion Tecnica:", 115, y); line(160, 185, y - mm(1));
  } else {
    text("V.B. JEFE DE SERVICIO", 20, y); line(60, 130, y - mm(1));
  }

  if (tipo === "LP") {
    y -= mm(14);
    text("RESERVADO A GERENCIA DE RECURSOS HUMANOS", 20, y, { bold: true });
    line(20, 130, y - mm(1.5));

    y -= mm(9);
    text("Esta solicitud fue recibida el", 20, y);
    line(65, 120, y - mm(1));
    text("a las", 122, y);
    line(133, 165, y - mm(1));
    text("hs.", 167, y);

    y -= mm(8);
    text("Consultada la Unidad Organizacional", 20, y);
    line(78, 165, y - mm(1));
    text("NO / SI", 167, y);
    y -= mm(4);
    text("se han entregado los numeros para las consultas comprendidas en esta solicitud de licencia particular", 20, y, { size: 8.5 });

    y -= mm(8);
    line(20, 185, y);

    y -= mm(7);
    text("Funcionario que recibio la solicitud", 20, y, { bold: true });

    y -= mm(8);
    text("AUTORIZADO POR", 20, y);
    line(50, 185, y - mm(1));

    y -= mm(8);
    text("TOMADO NOTA MESA", 20, y);
    line(58, 100, y - mm(1));
    text("FECHA", 102, y);
    line(115, 145, y - mm(1));
    text("FIRMA", 148, y);
    line(160, 185, y - mm(1));

    y -= mm(8);
    text("NOMBRE DEL MEDICO SUPLENTE", 20, y);
    line(78, 145, y - mm(1));
    text("N° REG", 148, y);
    line(162, 185, y - mm(1));

    y -= mm(8);
    text("OBSERVACIONES", 20, y);
    line(55, 185, y - mm(1));
    y -= mm(5);
    line(20, 185, y);
  } else {
    y -= mm(20);
    text("RESERVADO PARA LA GERENCIA DE RECURSOS HUMANOS", 20, y, { bold: true });
    line(20, 150, y - mm(1.5));

    y -= mm(22);
    line(90, 185, y);
    centered("Funcionario que recibio la solicitud", 137.5, y - mm(5), { size: 9 });

    y -= mm(16);
    text("TOMADO NOTA MESA", 20, y);
    line(58, 100, y - mm(1));
    text("FECHA", 103, y);
    line(116, 150, y - mm(1));
    text("FIRMA", 154, y);
    line(166, 185, y - mm(1));
  }

  return await pdfDoc.save();
}

const VAPID_PUBLIC_KEY_COORD = "BHNTEZRf4uqYFfr_IqFMk6e8w6gcg115m7FRausnVsGjM6e7u48Ec1w-H7KouhwMFmXsuQm1x5WN5O1a37E9HSM";
const btnNotifCoord = document.getElementById("btn-notif-coord");
const notifCoordStatus = document.getElementById("notif-coord-status");
let swRegistrationCoord = null;

function urlBase64ToUint8ArrayCoord(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function sincronizarSuscripcionCoord(opts = {}) {
  const silencioso = opts.silencioso === true;
  if (!silencioso) notifCoordStatus.textContent = "Activando...";
  try {
    if (!silencioso) {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") {
        notifCoordStatus.textContent = "No diste permiso para notificaciones.";
        return;
      }
    }
    if (!swRegistrationCoord) swRegistrationCoord = await navigator.serviceWorker.ready;
    let sub = await swRegistrationCoord.pushManager.getSubscription();
    if (!sub) {
      sub = await swRegistrationCoord.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8ArrayCoord(VAPID_PUBLIC_KEY_COORD)
      });
    }
    const subJson = sub.toJSON();
    await fetch(`${SUPABASE_URL}/rest/v1/coordinador_push_subscriptions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify({
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      })
    });
    if (!silencioso) {
      notifCoordStatus.textContent = "✓ Avisos de coordinador activados";
      btnNotifCoord.style.display = "none";
    }
  } catch (e) {
    if (!silencioso) notifCoordStatus.textContent = "Error: " + e.message;
  }
}

function actualizarBotonNotifCoord() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    btnNotifCoord.style.display = "none";
    return;
  }
  if (Notification.permission === "granted") {
    btnNotifCoord.style.display = "none";
    notifCoordStatus.textContent = "✓ Avisos de coordinador activados";
    sincronizarSuscripcionCoord({ silencioso: true });
  } else if (Notification.permission === "denied") {
    btnNotifCoord.style.display = "none";
    notifCoordStatus.textContent = "Notificaciones bloqueadas en este dispositivo.";
  } else {
    btnNotifCoord.style.display = "block";
    notifCoordStatus.textContent = "";
  }
}

btnNotifCoord.addEventListener("click", () => sincronizarSuscripcionCoord({ silencioso: false }));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").then((reg) => {
      swRegistrationCoord = reg;
      actualizarBotonNotifCoord();
    }).catch(() => {});
  });
}
