function textoEncabezado(estructura, col, sector) {
  for (let r = estructura.first_day_row - 1; r >= 0; r--) {
    const v = estructura.filas[r][col]?.v;
    if (v && String(v).trim() !== "") {
      const raw = String(v).trim();
      // Traducir usando HEADER_MAP si hay sector
      if (sector) {
        const mapped = HEADER_MAP[`${sector}|${raw.toUpperCase()}`]
                    || HEADER_MAP[`${sector}|${raw}`];
        if (mapped) return mapped;
      }
      return raw;
    }
  }
  return "";
}

async function renderGrilla() {
  if (sectorActual === "MIS_TURNOS") {
    renderCalendarioMisTurnos();
    return;
  }
  grillaWrap.innerHTML = skeletonGrilla();

  const claveCacheHoja = `${sectorActual}|${mesActivo}`;
  let estructura = hojasExcelCache[claveCacheHoja];
  if (!estructura) {
    const filas2 = await sb(`hojas_excel?select=estructura&sector=eq.${sectorActual}&mes=eq.${mesActivo}-01`);
    if (!filas2 || !filas2.length) {
      grillaWrap.innerHTML = `<div class="status-msg">No hay estructura cargada para ${sectorActual} en ${mesActivo}.</div>`;
      return;
    }
    estructura = filas2[0].estructura;
    hojasExcelCache[claveCacheHoja] = estructura;
  }

  const info = sectoresPorNombre[sectorActual];
  const grupoHabilitado = miGrupoHabilitadoAhora();
  // Habilitación cruzada: la persona tiene personal_sectores en un sector de
  // OTRO grupo (ej. Wagner de TC habilitado en DENSITO, que es de RESTO) sin
  // estar en la lista de prelación de ese grupo. Alcanza con que esté activa
  // AHORA en cualquier proceso propio y tenga la habilitación personal para
  // este sector puntual. Debe coincidir con la misma regla de tomar_turno.
  const tengoTurnoActivoAhora = procesosActivos.some(p => p.persona_actual_id === personaActual.id);
  const habilitacionCruzada = misSectoresHabilitados.has(sectorActual) && tengoTurnoActivoAhora;
  // SUISAS no separa BSE / RESO Sede Central como la Española (esas dos
  // listas son cosa de la Española nada más) — en rondas_suisas el grupo
  // siempre es el genérico "RESO", cubriendo ambos sectores a la vez. Por
  // eso acá no se pasa por grupoProcesoDeSector para SUISAS, se compara
  // directo contra el grupo crudo del sector.
  const grupoProcesoEfectivo = personaActual.empresa === "SUISAS"
    ? info?.grupo
    : grupoProcesoDeSector(sectorActual, info?.grupo);
  // NUEVO (11 ago 2026): SOLY tiene ademas la franja 67 (TC Soly), que
  // pertenece al grupo especial TC_SOLY en vez de RESTO. Si a la persona le
  // toca elegir ahi (grupoHabilitado === "TC_SOLY"), tambien se habilita la
  // vista del sector SOLY.
  const puedoElegirAca = info && (
    grupoHabilitado === grupoProcesoEfectivo
    || habilitacionCruzada
    || (sectorActual === "SOLY" && grupoHabilitado === "TC_SOLY")
  );

  // Indexar turnos de este sector por (dia, col_excel) y también por id
  const porCeldaReal = {};
  const porTurnoId = {};
  for (const t of turnosDelMes) {
    if (!t.franjas_horarias || t.franjas_horarias.sectores?.nombre !== sectorActual) continue;
    const dia = Number(t.fecha.slice(8, 10));
    const key = t.col_excel != null ? `${dia}-col:${t.col_excel}` : `${dia}-${t.franjas_horarias.nombre}`;
    porCeldaReal[key] = t;
    porTurnoId[t.id] = t;
  }

  const { cols, merges, filas, dia_col, first_day_row, last_day_row, ultima_col_real, columnas_grises } = estructura;

  // Limite real de columnas con contenido (evita la cola vacia que arrastran
  // algunas hojas de Excel, ej. BQ/EMERG/POLI/SOLY llegan a Z aunque la
  // planilla real termine mucho antes). Si el sector todavia no tiene este
  // limite cargado en Supabase, se usa cols.length como antes (sin recorte).
  const totalCols = (typeof ultima_col_real === "number") ? ultima_col_real + 1 : cols.length;
  // Set de columnas que realmente tienen bordeado en el Excel (las unicas
  // que reciben el gris de fin de semana/feriado). Esto cubre no solo los
  // costados (margen a la izquierda, notas/relleno a la derecha) sino
  // tambien columnas separadoras en el medio de hojas con dos tablas lado
  // a lado (ej. CENDYTMA). Si el sector todavia no tiene esto cargado, se
  // pintan todas las columnas como antes (comportamiento viejo).
  const setColumnasGrises = Array.isArray(columnas_grises) ? new Set(columnas_grises) : null;

  // NUEVO (11 ago 2026): en modo oscuro, la columna de días queda pegada
  // a la izquierda con fondo blanco (sticky), pero a la derecha la tabla
  // termina justo en la última columna real, sin nada blanco después —
  // se ve "cortada". Cesar pidió agregar una columna blanca de relleno
  // al final, solo en las hojas donde se nota. Es puramente visual: una
  // columna y celda extra por fila, fuera del rango de merges/colspans
  // (que solo cubren 0..totalCols-1), asi que no puede pisar ninguna
  // combinacion de celdas existente.
  const sectoresConEspaciador = new Set([
    "BSE", "CCA", "CENDYTMA", "DENSITO", "FOTOG", "GREMCA",
    "POLI", "RESO", "RETEN", "SOLY", "TRAUMA", "UCAL"
  ]);
  const necesitaEspaciador = sectoresConEspaciador.has(sectorActual);

  // Marcar que celdas quedan "cubiertas" por una combinacion (merge), y el
  // tamaño de colspan/rowspan que corresponde al ancla de cada combinacion
  const cubierta = new Set();
  const ancla = {}; // "r-c" -> {rowspan, colspan}
  for (const m of merges) {
    const r1 = m.r1 - 1, c1 = m.c1 - 1, r2 = m.r2 - 1, c2 = m.c2 - 1;
    ancla[`${r1}-${c1}`] = { rowspan: r2 - r1 + 1, colspan: c2 - c1 + 1 };
    for (let r = r1; r <= r2; r++) {
      for (let c = c1; c <= c2; c++) {
        if (r === r1 && c === c1) continue;
        cubierta.add(`${r}-${c}`);
      }
    }
  }

  let html = `<table class="grilla"><colgroup>`;
  for (let i = 0; i < cols.slice(0, totalCols).length; i++) {
    const anchoOriginal = anchoExcelAPx(cols[i]);
    // Columnas angostas (dias, separadores < 60px) = ancho original
    // Columnas de datos = 90px fijo para que entre cualquier apellido
    const ancho = anchoOriginal < 60 ? anchoOriginal : 120;
    html += `<col style="width:${ancho}px">`;
  }
  if (necesitaEspaciador) html += `<col style="width:120px">`;
  html += `</colgroup><tbody>`;

  for (let r = 0; r < filas.length; r++) {
    const esFilaDeDia = r >= first_day_row && r <= last_day_row;
    let dia = null;
    let grisFila = false;
    if (esFilaDeDia) {
      dia = filas[r][dia_col].v;
      const fechaStr = `${mesActivo}-${String(dia).padStart(2, "0")}`;
      const d = new Date(fechaStr + "T12:00:00");
      const diaSemana = ((d.getDay() + 6) % 7) + 1; // 1=Lunes...7=Domingo
      const esFinde = diaSemana === 6 || diaSemana === 7;
      const esFeriado = feriadosSet.has(fechaStr) && sectorActual !== 'BSE';
      grisFila = esFinde || esFeriado;
    }

    html += `<tr>`;
    for (let c = 0; c < totalCols; c++) {
      if (cubierta.has(`${r}-${c}`)) continue;
      const celda = filas[r][c];
      const span = ancla[`${r}-${c}`];
      const attrs = span ? ` rowspan="${span.rowspan}" colspan="${span.colspan}"` : "";
      const bd = celda.bd;
      const esEncabezado = r < first_day_row;
      const borderStyle = esEncabezado
        ? "border:none;"
        : `border-top:${bd.t ? "1px solid #000" : "none"};border-bottom:${bd.b ? "1px solid #000" : "none"};border-left:${bd.l ? "1px solid #000" : "none"};border-right:${bd.r ? "1px solid #000" : "none"};`;
      const boldStyle = celda.bold ? "font-weight:700;" : "";

      let contenido = celda.v ?? "";
      let clases = "";

      // Guardia TC: tabla aparte "COBERTURA POR SUISAS" (filas 15 a 49,
      // columna Apellido = N). Cada fila tiene su propio Día (columna O) y
      // Horario (columna P), sin relación con el día de la grilla principal
      // de esa misma fila. Se busca el turno real por fecha + nombre de
      // franja, no por col_excel.
      if (sectorActual === "TC" && r >= 14 && r <= 50 && (c === 13 || c === 12)) {
        const diaG = filas[r][14]?.v;
        const horarioG = (filas[r][15]?.v || "").toString().trim();
        if (typeof diaG === "number" && horarioG) {
          const fechaG = `${mesActivo}-${String(diaG).padStart(2, "0")}`;
          const tG = turnosDelMes.find(t =>
            t.franjas_horarias?.sectores?.nombre === "TC" &&
            t.fecha === fechaG &&
            (t.franjas_horarias?.nombre || "").trim() === horarioG
          );
          // Cobertura fija reservada para SUISAS (nombre_externo="SUISAS",
          // sin persona_id todavía): es un turno real que hay que cubrir,
          // no un texto informativo fijo. Se ofrece "Elegir" solo a la
          // persona de SUISAS a la que le toca su turno de ronda ahora.
          const suisasPuedeElegirG = tG && !tG.persona_id && tG.nombre_externo === "SUISAS"
            && personaActual?.empresa === "SUISAS" && puedoElegirAca;
          // Igual que en la grilla principal: reserva SUISAS disponible ya
          // mismo, sin esperar la ronda (ver nota del 21 ago 2026 arriba).
          const esSuisasDirectoG = tG && !tG.persona_id && tG.nombre_externo === "SUISAS_DIRECTO";
          const suisasPuedeElegirDirectoG = esSuisasDirectoG
            && personaActual?.empresa === "SUISAS"
            && misSectoresHabilitados.has(sectorActual);
          if (c === 12) {
            // Nº Externo: se completa solo con el mismo turno de la columna
            // Apellido de al lado. No es clickeable por separado.
            if (tG && tG.persona_id && tG.perfiles) {
              contenido = tG.perfiles.ficha != null ? String(tG.perfiles.ficha) : "";
            } else if (suisasPuedeElegirG || suisasPuedeElegirDirectoG) {
              contenido = "";
            } else if (esSuisasDirectoG) {
              contenido = "SUISAS";
              clases += " suisas-directo-texto";
            } else if (tG && tG.nombre_externo) {
              // Cobertura externa fija (ej. SUISAS): mismo texto en las dos columnas
              contenido = sinTildes(tG.nombre_externo).toUpperCase();
            } else if (tG) {
              contenido = "LIBRE";
              clases += " libre-texto";
            } else {
              contenido = "";
            }
          } else if (tG) {
            if (suisasPuedeElegirG || suisasPuedeElegirDirectoG) {
              contenido = `<button class="btn-elegir" data-turno-id="${tG.id}">Elegir</button>`;
            } else if (esSuisasDirectoG) {
              contenido = "SUISAS";
              clases += " suisas-directo-texto";
            } else if (tG.persona_id || tG.nombre_externo) {
              const esPropio = tG.persona_id === personaActual?.id;
              if (esPropio && puedoElegirAca) {
                contenido = `<button class="btn-rechazar" data-turno-id="${tG.id}">Rechazar</button>`;
              } else {
                contenido = tG.perfiles ? nombreAsignado(tG.perfiles) : sinTildes(tG.nombre_externo).toUpperCase();
              }
            } else if (puedoElegirAca) {
              contenido = `<button class="btn-elegir" data-turno-id="${tG.id}">Elegir</button>`;
            } else {
              contenido = "LIBRE";
              clases += " libre-texto";
            }
          } else {
            contenido = "";
          }
        }
      } else if ((esFilaDeDia || r > last_day_row) && typeof celda.v === 'number' && celda.v >= 1 && celda.v <= 31) {
        // Celda con un número de 1 a 31. Si pertenece al calendario
        // principal (columnas_grises lo marca), pintar según fin de
        // semana/feriado — es solo pintura, no cambia qué se muestra. Si es
        // de una tabla aparte con su propio número de día (ej. "cobertura
        // por SUISAS" en TC), se deja sin colorear especial, pero igual se
        // "consume" la celda acá para que no caiga después en la rama
        // general y tape el número con "LIBRE".
        if (!setColumnasGrises || setColumnasGrises.has(c)) {
          clases += grisFila ? " gris" : " dia-semana";
        }
      } else if ((esFilaDeDia || r > last_day_row) && typeof celda.v === 'string' && /^\d{1,2}\s*A\s*\d{1,2}$/i.test(celda.v.trim())) {
        // Texto con forma de horario (ej. "8 A 20", "0 A 8"): es información
        // fija de referencia, no "quién está asignado" — se muestra tal cual.
        contenido = celda.v;
      } else if (esFilaDeDia) {
        // Regla única para toda celda de datos, sin mirar el color de la
        // celda (gris/amarillo/rojo) para nada: el color es solo pintura de
        // fondo (fin de semana/feriado), nunca decide qué se muestra acá.
        // 1) Si hay un turno real cargado en la base para este día+columna,
        //    manda su estado real (asignado / vacante).
        // 2) Si no hay ningún turno cargado, manda el texto de la celda tal
        //    cual viene del Excel (puede ser un apellido, "CUBRIR", "SUISAS", etc.).
        let diaLocal = dia;
        if (sectorActual === "TC") {
          // Sub-tablas de TC con su propio número de día en la columna
          // anterior (ej. la fila "16 A 20 (H)" de cobertura SUISAS).
          const posibleDia = filas[r][c - 1]?.v;
          if (typeof posibleDia === 'number' && posibleDia >= 1 && posibleDia <= 31) {
            diaLocal = posibleDia;
          }
        }
        const t = porCeldaReal[`${diaLocal}-col:${100 + r}`]
          || porCeldaReal[`${diaLocal}-col:${c}`]
          || porCeldaReal[`${dia}-${textoEncabezado(estructura, c, sectorActual)}`];

        // Cobertura fija reservada para SUISAS (nombre_externo="SUISAS", sin
        // persona_id todavía): es un turno real que hay que cubrir, no un
        // texto informativo fijo. Se ofrece "Elegir" solo a la persona de
        // SUISAS a la que le toca su turno de ronda ahora mismo.
        const suisasPuedeElegir = t && !t.persona_id && t.nombre_externo === "SUISAS"
          && personaActual?.empresa === "SUISAS" && puedoElegirAca;

        // NUEVO (21 ago 2026, a pedido de Cesar): celda que el coordinador
        // dejó vacante como "exclusiva SUISAS, disponible ya mismo" (marcada
        // con nombre_externo="SUISAS_DIRECTO"). A diferencia de la reserva
        // normal de arriba, ésta no espera a que arranque la ronda de ese
        // grupo — alcanza con ser de SUISAS y tener ese sector habilitado.
        const esSuisasDirecto = t && !t.persona_id && t.nombre_externo === "SUISAS_DIRECTO";
        const suisasPuedeElegirDirecto = esSuisasDirecto
          && personaActual?.empresa === "SUISAS"
          && misSectoresHabilitados.has(sectorActual);

        if (suisasPuedeElegir || suisasPuedeElegirDirecto) {
          contenido = `<button class="btn-elegir" data-turno-id="${t.id}">Elegir</button>`;
        } else if (esSuisasDirecto) {
          // Reservada para SUISAS y disponible ya mismo, pero esta persona
          // no es quien puede tomarla (Española, o SUISAS sin ese sector
          // habilitado) — se muestra igual que cualquier otra reserva de
          // SUISAS, nunca como "LIBRE" genérica.
          contenido = "SUISAS";
          clases += " suisas-directo-texto";
        } else if (t && (t.persona_id || t.nombre_externo)) {
          const esPropio = t.persona_id === personaActual?.id;
          if (esPropio && puedoElegirAca) {
            contenido = `<button class="btn-rechazar" data-turno-id="${t.id}">Rechazar</button>`;
          } else {
            contenido = t.perfiles ? nombreAsignado(t.perfiles) : sinTildes(t.nombre_externo).toUpperCase();
          }
        } else if (t) {
          // Turno real vacante (nadie asignado todavía, por la razón que sea).
          if (sectorActual === "FOTOG") {
            // FOTOG nunca se cubre por convocatoria (regla de Cesar: la
            // hoja de fotógrafos es solo informativa, jamás se ofrece a
            // suplentes). Va primero y sin excepción: aunque sea el turno
            // de la persona en la cola de RESTO, acá nunca se muestra
            // botón de Elegir, se deja vacío.
            contenido = "";
          } else if (puedoElegirAca) {
            contenido = `<button class="btn-elegir" data-turno-id="${t.id}">Elegir</button>`;
          } else {
            contenido = "LIBRE";
            clases += " libre-texto";
          }
        } else if (celda.v) {
          // No hay ningún turno cargado en la base para esta celda: se
          // muestra el texto del Excel tal cual (de solo lectura).
          contenido = sinTildes(String(celda.v)).toUpperCase();
        } else if (!grisFila && c !== dia_col && (!setColumnasGrises || setColumnasGrises.has(c))) {
          // Día de semana (no sábado/domingo/feriado) sin turno cargado y
          // sin texto en el Excel, en una columna real de la tabla (no un
          // margen, separador o columna de notas): no hay actividad ahí.
          // Se marca con "X" en vez de depender de que la celda haya
          // quedado pintada gris al importar (esa marca no siempre está
          // guardada).
          contenido = "X";
        } else {
          contenido = "";
        }
      }

      if (grisFila && (setColumnasGrises ? setColumnasGrises.has(c) : true)) clases += " gris";
      // Pintura pura: si la celda del Excel viene marcada gris (ej. días sin
      // actividad que Cesar pinta a mano en CCA), se pinta gris acá también.
      // Esto es solo estética — no participa en ninguna decisión de arriba
      // sobre qué contenido mostrar.
      if (celda.g) clases += " gris";

      // Columna de días: sticky para no perderse al hacer scroll horizontal
      const esColDia = esFilaDeDia && c === dia_col;
      const stickyStyle = esColDia ? "position:sticky;left:0;z-index:2;background:inherit;" : "";

      html += `<td${attrs} style="${borderStyle}${boldStyle}${stickyStyle}" class="${clases.trim()}">${contenido}</td>`;
    }
    if (necesitaEspaciador) html += `<td style="border:none;"></td>`;
    html += `</tr>`;
  }
  // NUEVO (11 ago 2026): fila en blanco al final, del mismo alto que una
  // fila normal (24px, ya definido en table.grilla td/th), para que la
  // tabla no termine "cortada" justo en la última fila con contenido.
  // Un solo <td colspan> nuevo, fuera del rango de columnas/merges
  // reales, asi que no puede pisar ninguna combinacion de celdas.
  const colspanEspaciadorFinal = totalCols + (necesitaEspaciador ? 1 : 0);
  html += `<tr><td colspan="${colspanEspaciadorFinal}" style="border:none;"></td></tr>`;
  html += `</tbody></table>`;
  grillaWrap.innerHTML = html;

  grillaWrap.querySelectorAll(".btn-elegir").forEach(btn => {
    btn.addEventListener("click", () => elegirTurno(Number(btn.dataset.turnoId), btn));
  });
  grillaWrap.querySelectorAll(".btn-rechazar").forEach(btn => {
    btn.addEventListener("click", () => rechazarTurno(Number(btn.dataset.turnoId), btn));
  });
}

// Feedback visual inmediato al tocar Elegir/Rechazar: deshabilita el
// boton y muestra un spinner en vez del texto, para que quede claro que
// el toque se registró. Si el flujo termina sin recargar la grilla (por
// ejemplo, el usuario cancela un aviso de conflicto), se restaura el
// boton a su estado original con restaurarBoton().
function marcarCargando(btn) {
  if (!btn) return null;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = "0.75";
  btn.innerHTML = `<span class="btn-spinner"></span>`;
  return original;
}
function restaurarBoton(btn, original) {
  if (!btn || original == null) return;
  btn.disabled = false;
  btn.style.opacity = "";
  btn.innerHTML = original;
}

// Sonidos generados con Web Audio API (sin archivos externos - funciona
// offline, sin dependencias de red). Se llama siempre dentro de un
// handler de click, así que no choca con las políticas de autoplay de
// iOS/Safari. Envuelto en try/catch: si falla por lo que sea, la app
// sigue funcionando en silencio, nunca corta el flujo real.
let audioCtx = null;
function getAudioCtx() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
function tono(ctx, frecuencia, inicioSeg, duracionSeg, volumen = 0.15) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = frecuencia;
  const t0 = ctx.currentTime + inicioSeg;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volumen, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duracionSeg);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duracionSeg + 0.05);
}
function sonidoConvocatoriaCerrada() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    // Frase alegre con rebote: sube, baja un poco, vuelve a subir...
    tono(ctx, 523.25,  0.00, 0.12, 0.14); // C5
    tono(ctx, 659.25,  0.09, 0.12, 0.15); // E5
    tono(ctx, 783.99,  0.18, 0.12, 0.16); // G5
    tono(ctx, 1046.50, 0.27, 0.14, 0.17); // C6
    tono(ctx, 783.99,  0.40, 0.10, 0.13); // G5 (rebote)
    tono(ctx, 1046.50, 0.48, 0.12, 0.16); // C6
    tono(ctx, 1318.51, 0.58, 0.16, 0.18); // E6
    // ...acorde mayor grande, sostenido más tiempo = el "ta-da"
    tono(ctx, 1046.50, 0.74, 0.65, 0.20); // C6
    tono(ctx, 1318.51, 0.74, 0.65, 0.17); // E6
    tono(ctx, 1567.98, 0.74, 0.65, 0.15); // G6
    tono(ctx, 2093.00, 0.74, 0.65, 0.10); // C7
    // ...destello final de brillo
    tono(ctx, 2349.32, 0.85, 0.15, 0.06); // D7
    tono(ctx, 2637.02, 0.92, 0.16, 0.06); // E7
    tono(ctx, 3135.96, 1.00, 0.20, 0.05); // G7
  } catch (e) { /* silencioso si falla */ }
}
function tonoError(ctx, freq, inicioSeg, duracionSeg, volumen = 0.16) {
  // Onda cuadrada en vez de seno = sonido más áspero, tipo buzzer de
  // "denegado" - a propósito distinto de los tonos suaves de los otros
  // sonidos, para que se distinga como negativo de un vistazo (oído).
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + inicioSeg;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volumen, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duracionSeg);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duracionSeg + 0.05);
}
function sonidoTopeSuperado() {
  // Suena cuando alguien YA está en el tope e intenta elegir otra hora
  // igual (intento bloqueado) - no cuando lo alcanza con éxito.
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    tonoError(ctx, 180, 0,    0.15);
    tonoError(ctx, 160, 0.18, 0.20);
  } catch (e) { /* silencioso si falla */ }
}

async function confirmarConvocatoria() {
  if (!confirm("¿Confirmás que terminaste de elegir tus horas?")) return;
  try {
    const ok = await sb(`rpc/confirmar_convocatoria`, {
      method: "POST",
      body: JSON.stringify({ p_persona_id: personaActual.id, p_pin: personaPin })
    });
    if (ok === true) {
      sonidoConvocatoriaCerrada();
      await cargarDatosConvocatoria();
    } else {
      alert("No se pudo confirmar la convocatoria.");
    }
  } catch (e) {
    alert("Error: " + e.message);
  }
}

async function rechazarTurno(turnoId, btn = null) {
  const textoOriginal = marcarCargando(btn);
  try {
    const ok = await sb(`rpc/dejar_turno`, {
      method: "POST",
      body: JSON.stringify({ p_turno_id: turnoId, p_persona_id: personaActual.id, p_pin: personaPin })
    });
    if (ok === true) {
      // Actualizar localmente el turno en turnosDelMes para que el re-render
      // lo encuentre como vacante (persona_id = null) aunque col_excel sea null
      const turno = turnosDelMes.find(t => t.id === turnoId);
      if (turno) {
        turno.persona_id = null;
        turno.perfiles = null;
        turno.asignado_en = null;
      }
      await cargarDatosConvocatoria();
    } else {
      alert("No se pudo rechazar ese turno.");
      await cargarDatosConvocatoria();
    }
  } catch (e) {
    alert("Error al rechazar el turno: " + e.message);
    restaurarBoton(btn, textoOriginal);
  }
}

async function elegirTurno(turnoId, btn = null) {
  const textoOriginal = marcarCargando(btn);
  try {
    if ((window._horasActuales || 0) >= (window._topeHoras || 82)) {
      sonidoTopeSuperado();
      alert("Ya completaste tus horas para este mes.");
      restaurarBoton(btn, textoOriginal);
      return;
    }

    const chequeo = await sb(`rpc/chequear_conflicto_fija`, {
      method: "POST",
      body: JSON.stringify({ p_turno_id: turnoId, p_persona_id: personaActual.id })
    });
    const conflicto = Array.isArray(chequeo) ? chequeo[0] : null;
    if (conflicto && conflicto.hay_conflicto) {
      const confirma = confirm(
        `Cuidado: al elegir este turno estás superponiendo las horas con las de tu turno de ` +
        `${conflicto.sector} (${conflicto.franja}) del ${conflicto.fecha.slice(8,10)}/${conflicto.fecha.slice(5,7)}. ` +
        `Esas horas quedarán libres para que las elija otro suplente. ¿Confirmás?`
      );
      if (!confirma) { restaurarBoton(btn, textoOriginal); return; }
    }

    const resultado = await sb(`rpc/tomar_turno`, {
      method: "POST",
      body: JSON.stringify({ p_turno_id: turnoId, p_persona_id: personaActual.id, p_pin: personaPin })
    });
    if (resultado === 'ok' || resultado === 'ok_libero_fija') {
      await cargarDatosConvocatoria();
    } else if (resultado === 'limite_horas') {
      sonidoTopeSuperado();
      alert("Ya completaste tus horas para este mes.");
      await cargarDatosConvocatoria();
    } else if (resultado === 'superposicion') {
      alert("Ya tenés un turno en ese mismo horario ese día.");
      await cargarDatosConvocatoria();
    } else if (resultado === 'ya_tomado') {
      alert("Este turno ya fue tomado por otro.");
      await cargarDatosConvocatoria();
    } else if (resultado === 'pin_incorrecto') {
      alert("PIN incorrecto. Volvé a seleccionar tu nombre para ingresarlo de nuevo.");
      personaPin = null;
      personaIdConPin = null;
    } else {
      alert("No es tu turno para elegir.");
      await cargarDatosConvocatoria();
    }
  } catch (e) {
    alert("Error al elegir el turno: " + e.message);
    restaurarBoton(btn, textoOriginal);
  }
}

async function responderSolicitud(id, aceptar) {
  const ok = await sb(`rpc/responder_solicitud_cambio`, {
    method: "POST",
    body: JSON.stringify({
      p_solicitud_id: id,
      p_cobertura_id: personaActual.id,
      p_aceptar: aceptar,
      p_pin: personaPin
    })
  });
  if (ok === true) {
    await cargarSolicitudesPendientes();

      alert("Aceptaste cubrir el turno. El coordinador lo confirmará en breve.");
    } else {
      alert("Rechazaste la solicitud.");
    }
  } else {
    alert("Error al responder la solicitud.");
  }
}

const VAPID_PUBLIC_KEY = "BHNTEZRf4uqYFfr_IqFMk6e8w6gcg115m7FRausnVsGjM6e7u48Ec1w-H7KouhwMFmXsuQm1x5WN5O1a37E9HSM";
const btnNotif = document.getElementById("btn-notif");
const notifStatus = document.getElementById("notif-status");
let swRegistration = null;

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

function actualizarBotonNotif(personaId) {
  if (!personaId || !("serviceWorker" in navigator) || !("PushManager" in window)) {
    btnNotif.style.display = "none";
    notifStatus.textContent = "";
    return;
  }
  if (Notification.permission === "granted") {
    // Ya dio el permiso alguna vez en este dispositivo: no hace falta
    // mostrar el botón. Igual re-registramos la suscripción en silencio
    // cada vez que entra, por si el navegador la había invalidado sola
    // (pasa en iOS si no se abre la app por unos días) o si es la
    // primera vez que ESTE nombre puntual queda registrado en este
    // dispositivo (caso de gente con dos perfiles, Española + SUISAS).
    btnNotif.style.display = "none";
    notifStatus.textContent = "✓ Notificaciones activadas";
    sincronizarSuscripcion(personaId, { silencioso: true });
  } else if (Notification.permission === "denied") {
    btnNotif.style.display = "none";
    notifStatus.textContent = "Notificaciones bloqueadas en este dispositivo. Para recibir avisos, habilitalas desde los ajustes del teléfono/navegador.";
  } else {
    btnNotif.style.display = "block";
    notifStatus.textContent = "";
  }
}

async function sincronizarSuscripcion(personaId, opts = {}) {
  const silencioso = opts.silencioso === true;
  if (!silencioso) notifStatus.textContent = "Activando...";
  try {
    if (!silencioso) {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") {
        notifStatus.textContent = "No diste permiso para notificaciones.";
        return;
      }
    }
    if (!swRegistration) swRegistration = await navigator.serviceWorker.ready;
    let sub = await swRegistration.pushManager.getSubscription();
    if (!sub) {
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify({
        persona_id: personaId,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      })
    });
    if (!silencioso) {
      notifStatus.textContent = "✓ Notificaciones activadas";
      btnNotif.style.display = "none";
    }
  } catch (e) {
    // En modo silencioso no molestamos al usuario si falla la
    // renovación en segundo plano; se vuelve a intentar sola la
    // próxima vez que abra la app. En modo manual (botón) sí avisamos.
    if (!silencioso) notifStatus.textContent = "Error: " + e.message;
  }
}

async function activarNotificaciones() {
  const personaId = personaSelect.value;

}

// ---------------------------------------------------------
// Auto-login: si este dispositivo ya tiene una persona
// recordada (y sigue existiendo en la base), entra directo a
// su vista sin pedirle elegir el nombre de nuevo. El chequeo
// de PIN sigue corriendo igual (asegurarPin), pero como ya
// quedó validado en este dispositivo, no vuelve a preguntar.
// ---------------------------------------------------------
async function intentarAutoLogin() {
  const personaId = localStorage.getItem(CLAVE_ULTIMA_PERSONA);
  if (!personaId) return;
  const persona = (window.__personas || []).find(p => p.id === personaId);
  if (!persona) {
    // La persona ya no existe (se borró/cambió) — limpiar y no insistir
    localStorage.removeItem(CLAVE_ULTIMA_PERSONA);
    return;
  }
  personaSearch.value = nombreCompleto(persona) + etiquetaEmpresaPersona(persona);
  personaSelect.value = personaId;
  personaSelect.dispatchEvent(new Event("change"));
}

cargarPersonas().then(intentarAutoLogin);

<!-- Script chiquito, independiente del de arriba: solo achica el
     contenedor que centra la pantalla de "elegí tu nombre" en cuanto
     la convocatoria (grilla) queda visible, y lo vuelve a agrandar si
     se cierra sesión con "Cambiar de usuario". No lee ni modifica
     ninguna variable ni función de la app real. -->
<script>
(function(){
  var wrap = document.getElementById('inicio-centrado-wrap');
  var conv = document.getElementById('convocatoria-wrap');
  if (!wrap || !conv) return;
  function actualizar(){
    var visible = conv.style.display !== 'none';
    wrap.classList.toggle('cvt-compacto', visible);
  }
  actualizar();
  new MutationObserver(actualizar).observe(conv, { attributes:true, attributeFilter:['style'] });
})();
</script>

<!-- Script chiquito, independiente: resalta el botón de "Octubre" en el
     selector de meses (verde manzana, letras negras negrita). Como esos
     botones se arman dinámicamente en renderSelectorMeses(), esto no
     toca esa función — solo observa el contenedor y, cada vez que se
     vuelven a dibujar los botones, le aplica el estilo al que diga
     "Octubre". No lee ni modifica ninguna variable de la app real. -->
<script>
(function(){
  var wrapMeses = document.getElementById('mes-selector-wrap');
  if (!wrapMeses) return;
  function resaltarOctubre(){
    wrapMeses.querySelectorAll('.mes-tab').forEach(function(btn){
      var esOctubre = btn.textContent.trim().toLowerCase().startsWith('octubre');
      if (esOctubre) {
        btn.style.background = '#8BC53F';
        btn.style.borderColor = '#8BC53F';
        btn.style.color = '#000';
        btn.style.fontWeight = '700';
      }
    });
  }
  resaltarOctubre();
  new MutationObserver(resaltarOctubre).observe(wrapMeses, { childList:true });
})();
</script>
